<html>
    <head>
       <title>Minhas tarefas</title>
       <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    </head>
    <body>
        
        <div class="cartao"> 

        <h1>Lista de Tarefas!</h1>

        {% if lista %}
             <ol>
             {% for item in lista %}
                 <li>{{ item }}</li>
                 <a href="/delete/{{loop.index0}}"><button class="Lixo">Excluir</button></a>
             {% endfor %}
            </ol>
        {% else %}
             <p> Não há items, parabéns! Você fez todas as tarefas.</p>
        {% endif %}


        <form action="/add" method="post">
            <input type="text" name="nova">
            <button type="submit">adicionar</button>
        </form>
        </div>
    </body>

</html>
